name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build CPPIADecompiler.csproj --configuration Release

      - name: Publish
        run: >
          dotnet publish CPPIADecompiler.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:DebugType=none
          --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: CPPIADecompiler-linux-x64
          path: publish
          if-no-files-found: error
          retention-days: 30
